<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แรงดันจอมซิ่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&family=Pixelify+Sans:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05071a;font-family:"Pixelify Sans","Kanit",Tahoma,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);z-index:5}
  video{display:none}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(900px,90vw);max-height:92vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px;background:#1a1340;color:#fff;border:6px solid #fff;outline:6px solid #000;box-shadow:16px 16px 0 #000}
  .card h1{margin:0;line-height:0}
  .card h1 canvas{position:static;width:auto;height:auto}
  .card p{font-size:clamp(17px,2vw,24px);margin:0;line-height:1.45}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-family:"Kanit",Tahoma,sans-serif;font-size:clamp(18px,2.1vw,26px);padding:10px 24px;border:4px solid #000;border-radius:0;cursor:pointer;background:#ffcf33;color:#000;font-weight:800;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.5),6px 6px 0 #000}
  button:active{transform:translate(4px,4px);box-shadow:inset 5px 5px 0 rgba(0,0,0,.3),2px 2px 0 #000}
  button.blue{background:#4fd7ff} button.pink{background:#ff5fa2}
  button.tog{font-size:clamp(15px,1.6vw,20px);padding:8px 16px;background:#c9c3e6;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),4px 4px 0 #000}
  button.tog.on{background:#7be39a}
  .card p,.label,.lbtitle,table{font-family:"Kanit",Tahoma,sans-serif}
  button.small{font-size:18px;padding:8px 18px}
  .label{font-weight:700;font-size:18px}
  input{font:inherit;font-size:24px;padding:10px 14px;border:4px solid #000;border-radius:0;width:min(320px,60vw);background:#fff;color:#000;font-family:"Kanit",Tahoma,sans-serif}
  table{border-collapse:collapse;font-size:clamp(15px,1.6vw,20px);min-width:min(460px,80vw)}
  th,td{padding:4px 12px;border-bottom:2px dashed #5a4f9a}
  th{border-bottom:4px solid #fff;color:#ffcf33}
  tr.me td{background:#ffcf33;color:#000;font-weight:800}
  .lbtitle{font-weight:700;font-size:20px;margin-top:4px}
  .hidden{display:none!important}
  .legend span{font-family:Kanit,Tahoma,sans-serif;font-weight:800;padding:6px 14px;border:4px solid #000;color:#fff;font-size:clamp(15px,1.7vw,20px)}
  #status{font-size:16px;color:#a9a2d6;font-family:"Kanit",Tahoma,sans-serif}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>
<canvas id="u"></canvas>

<div id="start" class="card">
  <h1>แรงดันจอมซิ่ง!</h1>
  <p><b>ปัดมือไปทางขวา</b> ผ่านตัวรถเพื่อดันให้วิ่ง<br>ยิ่งปัดแรง รถยิ่งไปไกล ต้องจอดให้ตรงธงนะ อย่าให้ตกหน้าผา!</p>
  <div class="row">
    <span class="label">เลือกรถ:</span>
    <button id="car0" class="tog" onclick="setCar(0)">รถเข็น (เบา)</button>
    <button id="car1" class="tog on" onclick="setCar(1)">รถเก๋ง (กลาง)</button>
    <button id="car2" class="tog" onclick="setCar(2)">รถบรรทุก (หนัก)</button>
  </div>
  <div class="row">
    <button class="blue" onclick="startGame('solo')">เล่นคนเดียว</button>
    <button class="pink" onclick="startGame('duo')">แข่ง 2 คน</button>
  </div>
  <div id="status">กำลังเปิดกล้อง...</div>
</div>

<div id="end" class="card hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <div class="row"><button class="blue" onclick="showStart()">กลับเมนู</button></div>
</div>

<script type="module">
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ucanvas = document.getElementById('u'), U = ucanvas.getContext('2d');
const video = document.getElementById('video'), statusEl = document.getElementById('status');
const PX = 4, PXU = 2;
const INK = '#000', PAPER = '#1a1340', THAI = 'Kanit,Tahoma,sans-serif';
const P_COLORS = ['#ff5fa2', '#3fb6ff'], P_NAMES = ['ฝั่งซ้าย', 'ฝั่งขวา'];
let W, H;

// ---------- ข้อมูลเกม ----------
const LEVELS = [
  {name:'ถนน',       mu:1.0,  c:0.60, top:'#6b6b78', mid:'#4a4a55', deco:'road',
   hint:'ถนนเรียบ แรงเสียดทานปานกลาง ลองกะแรงดู!', fact:'แรงเสียดทานคือแรงที่ต้านการเคลื่อนที่ ทำให้รถค่อย ๆ หยุด'},
  {name:'สนามหญ้า', mu:1.7,  c:0.55, top:'#4caf50', mid:'#2e7d32', deco:'grass',
   hint:'หญ้าขรุขระกว่าถนน ต้องดันแรงขึ้นนะ!', fact:'พื้นยิ่งขรุขระ แรงเสียดทานยิ่งมาก รถเลยหยุดเร็วกว่า'},
  {name:'ทราย',      mu:3.0,  c:0.50, top:'#f2d27a', mid:'#c9a24f', deco:'sand',
   hint:'ทรายหนืดมาก! ต้องปัดแรงสุด ๆ', fact:'ทรายมีแรงเสียดทานสูงมาก ล้อรถจมและหยุดเร็ว'},
  {name:'ลานน้ำแข็ง', mu:0.25, c:0.70, top:'#c9f3ff', mid:'#7fc8e8', deco:'ice',
   hint:'ลื่นปรี๊ด! ปัดเบา ๆ ก็พอ ระวังตกหน้าผา!', fact:'น้ำแข็งลื่น แรงเสียดทานน้อยมาก รถเลยไถลไปได้ไกล'},
];
const CARS = [
  {name:'รถเข็น',   m:0.7, size:0.8, body:'#ff8a3d', top:'#ffd23f'},
  {name:'รถเก๋ง',   m:1.0, size:1.0, body:'#ff4f6d', top:'#ffd0d8'},
  {name:'รถบรรทุก', m:1.6, size:1.3, body:'#3f8fff', top:'#bfe3ff'},
];
const G = 1.32, ZONE = 0.07, CLIFF = 0.95, SHOTS = 2, READY_LIMIT = 15;

let mode = 'solo', carType = 1, state = 'menu', players = [], countdown = 0, lastT = 0, lastBeep = 4;
let lv = 0, shot = 0, intro = 0, particles = [], banner = null;

function resize(){
  W = innerWidth; H = innerHeight;
  canvas.width = Math.ceil(W/PX); canvas.height = Math.ceil(H/PX);
  ucanvas.width = Math.ceil(W/PXU); ucanvas.height = Math.ceil(H/PXU);
  ctx.setTransform(1/PX,0,0,1/PX,0,0); U.setTransform(1/PXU,0,0,1/PXU,0,0);
  ctx.imageSmoothingEnabled = false; U.imageSmoothingEnabled = false;
  players.forEach(layoutPlayer);
}
addEventListener('resize', resize);

// ---------- เสียง ----------
let actx = null;
function audio(){ if (!actx) try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch {} return actx; }
function tone(f, d=0.15, type='square', vol=0.1, delay=0, f2=null){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
const sfx = {
  push:  ()=>{ tone(120,0.25,'sawtooth',0.12,0,60); tone(300,0.15,'square',0.08,0,900); },
  star:  n => { for (let i=0;i<n;i++) tone(880+i*220,0.15,'square',0.09,0.15+i*0.18); },
  perfect:()=> [523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,0.18,'square',0.09,i*0.08)),
  miss:  ()=> tone(300, 0.4, 'triangle', 0.1, 0, 150),
  fall:  ()=>{ tone(900, 0.8, 'square', 0.08, 0, 80); tone(60, 0.3, 'sawtooth', 0.15, 0.8); },
  beep:  ()=> tone(520, 0.15, 'square', 0.1),
  go:    ()=> tone(880, 0.35, 'square', 0.12),
  win:   ()=> [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.25,'square',0.1,i*0.12)),
};

// ---------- เมนู ----------
window.setCar = i => { carType = i; [0,1,2].forEach(k => document.getElementById('car'+k).classList.toggle('on', k===i)); };
window.showStart = ()=>{
  state = 'menu'; players = [];
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};
window.startGame = m => {
  audio(); mode = m; lv = 0; shot = 0;
  players = mode==='solo' ? [makePlayer(0,0,1)] : [makePlayer(0,0,0.5), makePlayer(1,0.5,1)];
  players.forEach(layoutPlayer);
  particles = []; banner = null; state = 'countdown'; countdown = 3.999; lastBeep = 4;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
};
addEventListener('keydown', e=>{
  if (e.code === 'Space' && state === 'over') showStart();
  if (e.code === 'Escape') showStart();
});

// ---------- ผู้เล่น ----------
function makePlayer(idx, f0, f1){
  return {idx, f0, f1, s:0, v:0, v0:0, phase:'wait', stars:Array(LEVELS.length).fill(0), last:0, msg:null, readyT:0,
          fallY:0, fallVY:0, rot:0, engT:0, hand:{x:-999,y:-999,seen:false}, hist:[], pts:null, lost:0};
}
function layoutPlayer(p){
  p.x0 = p.f0*W; p.x1 = p.f1*W; const w = p.x1-p.x0;
  p.startX = p.x0 + w*0.15; p.L = w*0.8; p.groundY = H*0.68;
  p.cw = Math.min(w*0.09, 150) * CARS[carType].size; p.ch = p.cw*0.55;
}
const carX = p => p.startX + p.s*p.L;
function resetShot(p){ p.s = 0; p.v = 0; p.v0 = 0; p.fallY = 0; p.fallVY = 0; p.rot = 0; p.phase = 'ready'; p.readyT = 0; p.msg = null; }
function beginLevel(){ intro = 2.8; players.forEach(p => { resetShot(p); p.phase = 'wait'; }); banner = null; }
function handSpeed(p){ // ความเร็วมือแนวนอน (px/วินาที) จาก 0.12 วินาทีล่าสุด
  const h = p.hist; if (h.length < 2) return 0;
  const b = h[h.length-1]; let best = 0;
  for (let i = h.length-2; i >= 0; i--){ const dt = (b.t - h[i].t)/1000; if (dt >= 0.03) best = Math.max(best, (b.x - h[i].x)/dt); if (dt > 0.08) break; }
  return best;
}
function updatePlayer(p, dt, now){
  const L = LEVELS[lv], car = CARS[carType];
  // เก็บประวัติตำแหน่งมือ
  if (p.hand.seen){ p.hist.push({t: now, x: p.hand.x}); while (p.hist.length && now - p.hist[0].t > 120) p.hist.shift(); } else p.hist = [];
  if (p.phase === 'ready'){
    p.readyT += dt;
    const cx = carX(p), vx = handSpeed(p), h = p.hand;
    if (h.seen && h.x > cx - p.cw*0.3 && h.x < cx + p.cw*0.9 && Math.abs(h.y - (p.groundY - p.ch*0.5)) < H*0.35 && vx > W*0.3){
      p.v0 = Math.min(3.2, (vx / W) * 0.9 / car.m); p.v = p.v0; p.phase = 'moving'; sfx.push();
      dust(p, cx - p.cw*0.5, 14);
    } else if (p.readyT > READY_LIMIT){ finishShot(p, 0, 'หมดเวลา! ลองปัดมือผ่านตัวรถนะ', false); }
  } else if (p.phase === 'moving'){
    p.s += p.v*dt; p.v = Math.max(0, p.v - L.mu*G*dt);
    p.engT += dt; if (p.engT > 0.07 && p.v > 0.03){ p.engT = 0; tone(60 + p.v*140, 0.06, 'square', 0.04); }
    if (Math.random() < p.v*dt*(L.deco==='sand'?30:L.deco==='ice'?4:14)) dust(p, carX(p) - p.cw*0.5, 2);
    if (p.s > CLIFF){ p.phase = 'falling'; p.fallVY = 0; sfx.fall(); }
    else if (p.v <= 0) scoreShot(p);
  } else if (p.phase === 'falling'){
    p.s += p.v*dt*0.6; p.fallVY += 2400*dt; p.fallY += p.fallVY*dt; p.rot += dt*4;
    if (p.fallY > H) finishShot(p, 0, 'แรงเกินไป! ตกหน้าผาไปแล้ว', false);
  } else if (p.phase === 'result'){
    p.resT -= dt; if (p.resT <= 0) p.phase = 'done';
  }
}
function scoreShot(p){
  const c = LEVELS[lv].c, d = Math.abs(p.s - c);
  if (d <= ZONE){
    const e = d/ZONE, n = e < 0.25 ? 3 : e < 0.6 ? 2 : 1;
    finishShot(p, n, n === 3 ? 'PERFECT! จอดตรงธงเป๊ะ' : n === 2 ? 'เยี่ยม! เกือบตรงธงแล้ว' : 'เข้าเขตแล้ว! อีกนิดเดียว', true);
  } else if (p.s < c) finishShot(p, 0, 'ยังไม่ถึง! ต้องใช้แรงมากกว่านี้', false);
  else finishShot(p, 0, 'เลยไปนิด! ใช้แรงน้อยลงหน่อย', false);
}
function finishShot(p, n, text, ok){
  p.last = n; p.stars[lv] = Math.max(p.stars[lv], n); p.phase = 'result'; p.resT = 2.6;
  p.msg = {ok, title: text, t: 2.6, n};
  if (n === 3){ sfx.perfect(); confettiBurst(carX(p), p.groundY - p.ch); } else if (n > 0) sfx.star(n); else if (p.fallY === 0) sfx.miss();
}
function dust(p, x, n){
  const deco = LEVELS[lv].deco, col = deco==='sand' ? ['#f2d27a','#c9a24f'] : deco==='ice' ? ['#ffffff','#c9f3ff'] : deco==='grass' ? ['#8bd46a','#5a3b1e'] : ['#cfcfd8','#8a8a96'];
  for (let i=0;i<n;i++) particles.push({x, y:p.groundY-6, vx:-60-Math.random()*200, vy:-60-Math.random()*160, c:col[i%2], life:0.7, g:500});
}
function confettiBurst(x, y){
  const cols = ['#ff5fa2','#3fb6ff','#ffcf33','#7be39a','#ffffff'];
  for (let i=0;i<60;i++){ const a=Math.random()*Math.PI*2, v=200+Math.random()*400; particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-300,c:cols[i%5],life:1.4,g:700}); }
}
function confetti(x0, x1){
  const cols = ['#ff5fa2','#3fb6ff','#ffcf33','#7be39a','#ffffff','#b48cff'];
  for (let i=0;i<220;i++) particles.push({x:x0+Math.random()*(x1-x0), y:-20-Math.random()*H*0.5, vx:(Math.random()-0.5)*120, vy:100+Math.random()*200, c:cols[i%6], life:3.5, slow:true});
}
function advance(){
  if (state !== 'play' || !players.every(p => p.phase === 'done' || p.phase === 'wait')) return;
  const solo3 = mode === 'solo' && players[0].stars[lv] === 3; // ได้ 3 ดาวแล้วข้ามไปด่านต่อไปเลย
  if (shot + 1 < SHOTS && !solo3){ shot++; players.forEach(resetShot); return; }
  shot = 0;
  if (lv + 1 >= LEVELS.length){ players.forEach(p => p.phase = 'end'); endGame(); return; }
  lv++;
  beginLevel();
}

// ---------- จบเกม ----------
function endGame(){
  state = 'over'; sfx.win();
  const total = p => p.stars.reduce((a,b)=>a+b,0), max = LEVELS.length*3;
  const facts = '<br><span style="font-size:.85em">จำไว้นะ: ยิ่งออกแรงมาก ของยิ่งเคลื่อนที่ไกล · พื้นยิ่งขรุขระ แรงเสียดทานยิ่งมาก · ของยิ่งหนัก ยิ่งต้องใช้แรงมาก</span>';
  const row = p => LEVELS.map((L,i)=>`${L.name} ${'★'.repeat(p.stars[i])}${'☆'.repeat(3-p.stars[i])}`).join(' · ');
  if (mode === 'solo'){
    const p = players[0], t = total(p); confetti(0, W);
    const title = t >= 11 ? 'นักซิ่งระดับตำนาน!' : t >= 8 ? 'นักซิ่งมือโปร!' : t >= 4 ? 'นักซิ่งฝีมือดี!' : 'นักซิ่งฝึกหัด!';
    setTimeout(()=>{
      pixelTitle(document.getElementById('endTitle'), title);
      document.getElementById('endText').innerHTML = `ได้ <b>${t}</b> จาก ${max} ดาว (${CARS[carType].name})<br>${row(p)}${facts}`;
      document.getElementById('end').classList.remove('hidden');
    }, 1200);
    return;
  }
  const [a, b] = players, ta = total(a), tb = total(b);
  const w = ta > tb ? a : tb > ta ? b : null;
  if (w){ confetti(w.x0, w.x1); banner = {p: w}; } else confetti(0, W);
  setTimeout(()=>{
    pixelTitle(document.getElementById('endTitle'), w ? `${P_NAMES[w.idx]}ชนะ!` : 'เสมอกัน! เก่งทั้งคู่', w ? P_COLORS[w.idx] : '#ffcf33');
    const line = p => `<b style="color:${P_COLORS[p.idx]}">${P_NAMES[p.idx]}</b> ${total(p)} ดาว<br><span style="font-size:.8em">${row(p)}</span>`;
    document.getElementById('endText').innerHTML = `${line(a)}<br>${line(b)}${facts}`;
    document.getElementById('end').classList.remove('hidden');
  }, 2000);
}

// ---------- จับมือ ----------
let handOK = false, landmarker = null, lastVideoTime = -1;
addEventListener('mousemove', e=>{
  if (handOK || !players.length) return;
  const p = players.find(p => e.clientX >= p.x0 && e.clientX < p.x1) || players[0];
  players.forEach(q => { if (q !== p) q.hand.seen = false; });
  p.hand.x = e.clientX; p.hand.y = e.clientY; p.hand.seen = true;
});
async function initHands(){
  try{
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    await video.play();
    statusEl.textContent = 'เปิดกล้องแล้ว กำลังโหลดตัวจับมือ...';
    const {FilesetResolver, HandLandmarker} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d}, runningMode:'VIDEO', numHands:2});
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    handOK = true;
    statusEl.textContent = 'พร้อมเล่น! ยืนห่างกล้องประมาณ 1–1.5 เมตร แล้วยกมือขึ้น';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'เปิดกล้องหรือตัวจับมือไม่ได้ ตอนนี้เล่นด้วยเมาส์ได้ · ตรวจว่าอนุญาตกล้องและต่ออินเทอร์เน็ต';
  }
}
const mapPt = p => ({x:(1-(0.5+(p.x-0.5)*1.4))*W, y:(0.5+(p.y-0.5)*1.4)*H});
function trackHands(){
  if (!handOK || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const r = landmarker.detectForVideo(video, performance.now());
  const found = (r.landmarks || []).map(L => ({pts: L.map(mapPt), c: mapPt({x:(L[0].x+L[9].x)/2, y:(L[0].y+L[9].y)/2})}));
  const assigned = players.map(()=>null);
  if (mode === 'solo'){ if (found[0]) assigned[0] = found[0]; }
  else for (const f of found){ const side = f.c.x < W/2 ? 0 : 1; if (!assigned[side]) assigned[side] = f; }
  players.forEach((p,i)=>{
    const f = assigned[i];
    if (!f){ p.hand.seen = false; p.pts = null; return; }
    p.pts = f.pts;
    p.hand.x = p.hand.seen ? p.hand.x + (f.c.x-p.hand.x)*0.7 : f.c.x;
    p.hand.y = p.hand.seen ? p.hand.y + (f.c.y-p.hand.y)*0.7 : f.c.y;
    p.hand.seen = true;
  });
}

// ---------- วาด ----------
function sticker(x,y,w,h,fill,sh=6){
  const ctx = U;
  ctx.fillStyle='#000'; ctx.fillRect(x-4+sh,y-4+sh,w+8,h+8);
  ctx.fillStyle='#000'; ctx.fillRect(x-8,y-8,w+16,h+16);
  ctx.fillStyle='#fff'; ctx.fillRect(x-4,y-4,w+8,h+8);
  ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
}
function label(t, x, y, size, fill='#fff'){
  const ctx = U;
  ctx.font = `800 ${size}px ${/^[0-9A-Za-z!?\sx/.]+$/.test(t) ? '"Press Start 2P",' : ''}${THAI}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'miter';
  ctx.lineWidth = Math.max(6, size*0.28); ctx.strokeStyle = INK; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function pixStar(x, y, s, on){ // ดาวพิกเซล 5x5
  const ctx = U, m = ['..#..','.###.','#####','.###.','#.#.#'], c = s/5;
  ctx.fillStyle = '#000'; ctx.fillRect(x-s/2-3, y-s/2-3, s+6, s+6);
  ctx.fillStyle = on ? '#3a2f7a' : '#3a2f7a'; ctx.fillRect(x-s/2, y-s/2, s, s);
  ctx.fillStyle = on ? '#ffcf33' : '#6a5fae';
  m.forEach((row,j)=>[...row].forEach((ch,i)=>{ if (ch==='#') ctx.fillRect(x-s/2+i*c, y-s/2+j*c, c, c); }));
}
function drawBG(t){
  if (handOK && video.videoWidth){
    const vw=video.videoWidth, vh=video.videoHeight, s=Math.max(W/vw,H/vh);
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
    ctx.drawImage(video,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s); ctx.restore();
  } else {
    ctx.fillStyle='#4fc3f7'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; for (let i=0;i<6;i++){ const cx=((i*260 + t*0.02*(1+i%3)) % (W+200))-100, cy=40+((i*97)%5)*30; ctx.fillRect(cx,cy,80,24); ctx.fillRect(cx+16,cy-16,48,16); }
  }
}
function drawTrack(p, t){
  const L = LEVELS[lv], gy = p.groundY, x0 = p.x0, cliffX = p.startX + CLIFF*p.L + p.cw*0.5;
  // พื้น
  ctx.fillStyle = INK; ctx.fillRect(x0, gy-8, cliffX-x0+8, H-gy+8);
  ctx.fillStyle = L.top; ctx.fillRect(x0, gy, cliffX-x0, 28);
  ctx.fillStyle = L.mid; ctx.fillRect(x0, gy+28, cliffX-x0, H*0.12);
  ctx.fillStyle = '#5a3b1e'; ctx.fillRect(x0, gy+28+H*0.12, cliffX-x0, H);
  ctx.fillStyle = '#3e2914'; for (let x=x0+20; x<cliffX-20; x+=64) ctx.fillRect(x, gy+40+H*0.12, 16, 12);
  // ลวดลายพื้นผิว
  if (L.deco==='road'){ ctx.fillStyle='#ffcf33'; for (let x=x0+16; x<cliffX-40; x+=72) ctx.fillRect(x, gy+12, 36, 6); }
  if (L.deco==='grass'){ ctx.fillStyle='#2e7d32'; for (let x=x0+8; x<cliffX-8; x+=24) ctx.fillRect(x, gy-8, 6, 10); ctx.fillStyle='#ffef6b'; for (let x=x0+40; x<cliffX-20; x+=150) ctx.fillRect(x, gy-14, 8, 8); }
  if (L.deco==='sand'){ ctx.fillStyle='#c9a24f'; for (let x=x0+10; x<cliffX-8; x+=28) ctx.fillRect(x, gy+((x*7)%20), 6, 6); }
  if (L.deco==='ice'){ ctx.fillStyle='#ffffff'; for (let x=x0+30; x<cliffX-30; x+=110) { ctx.fillRect(x, gy+6, 40, 4); ctx.fillRect(x+48, gy+14, 12, 4); } }
  // หน้าผา
  ctx.fillStyle = INK; ctx.fillRect(cliffX, gy-8, 8, H);
  // เขตเป้าหมาย + ธง
  const zx0 = p.startX + (L.c-ZONE)*p.L, zx1 = p.startX + (L.c+ZONE)*p.L, fx = p.startX + L.c*p.L;
  ctx.fillStyle = 'rgba(123,227,154,.55)'; ctx.fillRect(zx0, gy-6, zx1-zx0, 34);
  ctx.fillStyle = '#ffcf33'; ctx.fillRect(zx0 + (zx1-zx0)*0.375, gy-6, (zx1-zx0)*0.25, 34);
  ctx.fillStyle = INK; ctx.fillRect(fx-4, gy-H*0.2, 8, H*0.2);
  const fw = 64, fh = 40, wave = Math.round(Math.sin(t/200)*2)*4;
  for (let i=0;i<4;i++) for (let j=0;j<3;j++){ ctx.fillStyle = (i+j)%2 ? '#fff' : INK; ctx.fillRect(fx+4+i*fw/4, gy-H*0.2+j*fh/3 + (i%2?wave:0), fw/4, fh/3); }
  // ลูกศรบอกทิศตอนรอดัน
  if (p.phase === 'ready'){
    const cx = carX(p), ay = gy - p.ch - 70, k = (Math.floor(t/150)%4)*12;
    ctx.fillStyle = '#ffcf33';
    for (let i=0;i<3;i++){ const ax = cx - p.cw*0.4 + i*36 + k; ctx.fillRect(ax, ay-12, 12, 24); ctx.fillRect(ax+12, ay-6, 8, 12); }
  }
}
function drawCar(p, t){
  const car = CARS[carType], w = p.cw, h = p.ch;
  const cx = carX(p), x = cx - w/2, y = p.groundY - h - 4 + p.fallY;
  ctx.save();
  if (p.phase === 'falling'){ ctx.translate(cx, y + h/2); ctx.rotate(p.rot); ctx.translate(-cx, -(y + h/2)); }
  const bump = p.phase==='moving' && p.v > 0.05 ? (Math.floor(t/60)%2)*4 : 0;
  const by = y - bump;
  ctx.fillStyle = INK;
  if (carType === 0){ // รถเข็น
    ctx.fillRect(x-6, by+h*0.15-6, w*0.85+12, h*0.6+12);
    ctx.fillStyle = car.body; ctx.fillRect(x, by+h*0.15, w*0.85, h*0.6);
    ctx.fillStyle = car.top; for (let i=0;i<3;i++) ctx.fillRect(x+8+i*w*0.27, by+h*0.25, w*0.18, h*0.15);
    ctx.fillStyle = INK; ctx.fillRect(x+w*0.85, by-h*0.15, 10, h*0.6); ctx.fillRect(x+w*0.85, by-h*0.15, w*0.18, 10);
  } else if (carType === 1){ // รถเก๋ง
    ctx.fillRect(x-6, by+h*0.35-6, w+12, h*0.45+12);
    ctx.fillRect(x+w*0.2-6, by-6, w*0.55+12, h*0.4+12);
    ctx.fillStyle = car.body; ctx.fillRect(x, by+h*0.35, w, h*0.45); ctx.fillRect(x+w*0.2, by, w*0.55, h*0.4);
    ctx.fillStyle = car.top; ctx.fillRect(x+w*0.27, by+8, w*0.18, h*0.25); ctx.fillRect(x+w*0.5, by+8, w*0.18, h*0.25);
    ctx.fillStyle = '#ffef6b'; ctx.fillRect(x+w-12, by+h*0.42, 12, 10);
  } else { // รถบรรทุก
    ctx.fillRect(x-6, by-6, w*0.68+12, h*0.8+12); ctx.fillRect(x+w*0.68, by+h*0.25-6, w*0.32+6, h*0.55+12);
    ctx.fillStyle = '#f0f0f0'; ctx.fillRect(x, by, w*0.68, h*0.8);
    ctx.fillStyle = '#d0d0d8'; for (let i=1;i<4;i++) ctx.fillRect(x+i*w*0.17, by+4, 4, h*0.8-8);
    ctx.fillStyle = car.body; ctx.fillRect(x+w*0.68, by+h*0.25, w*0.32, h*0.55);
    ctx.fillStyle = car.top; ctx.fillRect(x+w*0.76, by+h*0.32, w*0.16, h*0.2);
  }
  // ล้อ
  const wr = Math.max(12, h*0.22), wy = y + h - wr*0.6, spin = Math.floor(p.s*40) % 2;
  for (const wx of carType===0 ? [x+w*0.15, x+w*0.7] : [x+w*0.2, x+w*0.8]){
    ctx.fillStyle = INK; ctx.fillRect(wx-wr, wy-wr, wr*2, wr*2);
    ctx.fillStyle = '#9a9aa8'; ctx.fillRect(wx-wr*0.4, wy-wr*0.4, wr*0.8, wr*0.8);
    ctx.fillStyle = INK; ctx.fillRect(spin ? wx-wr*0.4 : wx-2, spin ? wy-2 : wy-wr*0.4, spin ? wr*0.8 : 4, spin ? 4 : wr*0.8);
  }
  // เส้นความเร็ว
  if (p.phase==='moving' && p.v > 0.4){ ctx.fillStyle='rgba(255,255,255,.8)'; for (let i=0;i<3;i++) ctx.fillRect(x - 30 - i*24 - (t/20%20), y + h*(0.2+i*0.25), 20 + p.v*20, 6); }
  ctx.restore();
}
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(p){
  if (!p.hand.seen) return;
  const col = mode==='duo' ? P_COLORS[p.idx] : '#8fe9ff';
  if (p.pts){
    ctx.lineCap='square';
    ctx.strokeStyle=INK; ctx.lineWidth=12; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(p.pts[a].x,p.pts[a].y); ctx.lineTo(p.pts[b].x,p.pts[b].y); ctx.stroke(); }
    ctx.strokeStyle=col; ctx.lineWidth=6; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(p.pts[a].x,p.pts[a].y); ctx.lineTo(p.pts[b].x,p.pts[b].y); ctx.stroke(); }
    ctx.fillStyle='#fff'; for (const q of p.pts) ctx.fillRect(q.x-5,q.y-5,10,10);
  }
  const r = Math.min(W,H)*0.045, hx = p.hand.x, hy = p.hand.y;
  ctx.fillStyle=INK; ctx.fillRect(hx-r-6, hy-r-6, r*2+12, 14); ctx.fillRect(hx-r-6, hy+r-8, r*2+12, 14); ctx.fillRect(hx-r-6, hy-r-6, 14, r*2+12); ctx.fillRect(hx+r-8, hy-r-6, 14, r*2+12);
  ctx.fillStyle = col; ctx.fillRect(hx-r-2, hy-r-2, r*2+4, 6); ctx.fillRect(hx-r-2, hy+r-4, r*2+4, 6); ctx.fillRect(hx-r-2, hy-r-2, 6, r*2+4); ctx.fillRect(hx+r-4, hy-r-2, 6, r*2+4);
}
function drawHUD(p){
  const ctx = U, f = Math.max(17, Math.min(W,H)*0.036), L = LEVELS[lv];
  ctx.font = `800 ${f}px ${THAI}`; ctx.textBaseline='middle'; ctx.textAlign='left';
  const txt = mode==='solo' ? `ด่าน ${lv+1}/4  ${L.name}   ครั้งที่ ${shot+1}/${SHOTS}` : `${P_NAMES[p.idx]}  ด่าน ${lv+1}/4`;
  const w = ctx.measureText(txt).width + 36, x = p.idx===1 ? p.x1-16-w-8 : p.x0+16;
  sticker(x, 16, w, f*1.7, mode==='duo' ? P_COLORS[p.idx] : PAPER);
  ctx.fillStyle = mode==='duo' ? '#000' : '#fff'; ctx.fillText(txt, x+18, 16+f*0.85);
  // ดาวสะสมแต่ละด่าน
  const ss = f*1.1; let sx = p.idx===1 ? p.x1 - 16 - (ss+6)*12 - 40 : p.x0 + 16 + ss/2, sy = 16 + f*1.7 + 18 + ss/2;
  for (let i=0;i<LEVELS.length;i++){ for (let k=0;k<3;k++){ pixStar(sx, sy, ss, p.stars[i] > k); sx += ss + 6; } sx += 14; }
  // มาตรวัดแรง
  if (p.v0 > 0){
    const bw = Math.min(220, (p.x1-p.x0)*0.3), bx = p.idx===1 ? p.x1-16-bw-8 : p.x0+16, by = sy + ss/2 + 18;
    ctx.font = `800 ${f*0.75}px ${THAI}`; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=5;
    ctx.strokeText('แรงที่ใช้', bx, by+10); ctx.fillText('แรงที่ใช้', bx, by+10);
    const mx = bx + f*3.6, mw = bw;
    ctx.fillStyle='#000'; ctx.fillRect(mx-4, by-4, mw+8, 28); ctx.fillStyle='#3a2f7a'; ctx.fillRect(mx, by, mw, 20);
    const n = Math.round(Math.min(1, p.v0*CARS[carType].m/3)*10);
    for (let k=0;k<n;k++){ ctx.fillStyle = k<4 ? '#7be39a' : k<7 ? '#ffcf33' : '#ff6b5e'; ctx.fillRect(mx+2+k*mw/10, by+2, mw/10-4, 16); }
  }
}
function drawDuoMiddle(){
  const ctx = U;
  ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.setLineDash([14,12]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  label('VS', W/2, H*0.4, Math.min(W,H)*0.07, '#ffcf33');
}
function drawMsg(p, dt){
  const m = p.msg; if (!m) return;
  m.t -= dt; if (m.t <= 0){ p.msg = null; return; }
  const ctx = U, pw = p.x1-p.x0, f = Math.max(18, Math.min(pw, H*1.6)*(mode==='solo'?0.032:0.036));
  const w = Math.min(pw*0.85, 900), h = f*3.6, x = p.x0 + (pw-w)/2, y = H*0.26;
  ctx.globalAlpha = Math.min(1, m.t*2);
  sticker(x, y, w, h, PAPER);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${f}px ${THAI}`; ctx.fillStyle = m.ok ? '#7be39a' : '#ff6b5e';
  ctx.fillText(m.title, x+w/2, y+f*1.0, w-24);
  const ss = f*1.3; for (let k=0;k<3;k++) pixStar(x+w/2 + (k-1)*(ss+12), y+f*2.5, ss, m.n > k);
  ctx.globalAlpha = 1;
}
function drawIntro(dt){
  intro -= dt;
  const L = LEVELS[lv], f = Math.min(W,H)*0.04, w = Math.min(W*0.8, 900), h = f*5.4, x = (W-w)/2, y = H*0.2;
  sticker(x, y, w, h, PAPER);
  label(`ด่าน ${lv+1}: ${L.name}`, W/2, y+f*1.3, f*1.5, '#ffcf33');
  const ctx = U; ctx.font = `800 ${f*0.85}px ${THAI}`; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText(L.hint, W/2, y+f*3.0, w-30);
  ctx.font = `${f*0.7}px ${THAI}`; ctx.fillStyle='#a9a2d6'; ctx.fillText(L.fact, W/2, y+f*4.3, w-30);
  if (intro <= 0) players.forEach(resetShot);
}
function drawParticles(dt){
  for (const p of particles){
    if (p.slow){ p.vx += (Math.random()-0.5)*40*dt; p.vy = Math.min(p.vy + 40*dt, 260); } else p.vy += (p.g||900)*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*(p.slow?0.6:1.3);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x/4)*4, Math.round(p.y/4)*4, 12, 12);
  }
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0 && p.y < H+40);
}
function drawCountdown(dt){
  countdown -= dt;
  const n = Math.ceil(countdown);
  if (n !== lastBeep && n >= 1){ sfx.beep(); lastBeep = n; }
  if (countdown <= 0){ sfx.go(); state = 'play'; beginLevel(); return; }
  const frac = countdown - Math.floor(countdown);
  label(String(n), W/2, H*0.36, Math.min(W,H)*(0.2 + 0.07*frac), '#ffcf33');
  label(mode==='duo' ? 'ยืนคนละฝั่ง แล้วยกมือขึ้น!' : 'สตาร์ทเครื่อง! ยกมือขึ้นเลย', W/2, H*0.55, Math.min(W,H)*0.05);
}
function drawWinner(){
  if (!banner || !banner.p) return;
  const p = banner.p, s = 1 + Math.sin(performance.now()/180)*0.06;
  label('ชนะ!', (p.x0+p.x1)/2, H*0.36, Math.min(W,H)*0.16*s, P_COLORS[p.idx]);
}

function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  trackHands(); U.clearRect(0,0,W,H); drawBG(t);
  if (state !== 'menu' && players.length){
    if (state === 'play' && intro <= 0){ players.forEach(p => updatePlayer(p, dt, t)); advance(); }
    players.forEach(p => drawTrack(p, t));
    players.forEach(p => drawCar(p, t));
    if (mode === 'duo') drawDuoMiddle();
    players.forEach(drawHUD);
    players.forEach(p => drawMsg(p, dt));
    if (state === 'countdown') drawCountdown(dt);
    if (state === 'play' && intro > 0) drawIntro(dt);
    drawWinner();
  }
  drawParticles(dt);
  players.forEach(drawHand);
  requestAnimationFrame(loop);
}
function pixelTitle(el, text, color='#ffcf33'){
  const sz = 22, c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = `800 ${sz}px ${THAI}`;
  c.width = Math.ceil(x.measureText(text).width) + 12; c.height = sz*1.7;
  x.font = `800 ${sz}px ${THAI}`; x.textBaseline = 'middle'; x.lineJoin = 'miter';
  x.lineWidth = 6; x.strokeStyle = '#000'; x.strokeText(text, 6, c.height/2+2);
  x.fillStyle = color; x.fillText(text, 6, c.height/2+2);
  const scale = Math.min(3, (Math.min(innerWidth*0.82, 820)) / c.width);
  c.style.width = c.width*scale + 'px'; c.style.height = c.height*scale + 'px';
  el.innerHTML = ''; el.appendChild(c);
}
window.__p = () => ({players, lv, shot, intro, state});
document.fonts.ready.then(()=> pixelTitle(document.querySelector('#start h1'), 'แรงดันจอมซิ่ง!', '#ff8a3d'));
resize(); initHands(); requestAnimationFrame(loop);
</script>
