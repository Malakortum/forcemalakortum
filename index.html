<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แรงดันจอมซิ่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Mali:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#6ec6ff;font-family:"Kanit",Tahoma,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh}
  video{display:none}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(900px,90vw);max-height:92vh;overflow:auto;box-sizing:border-box;
        display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 28px 28px;
        background:linear-gradient(180deg,#ffffff,#eaf6ff);color:#17325c;border-radius:28px;border:5px solid #1f5fc4;
        box-shadow:0 12px 0 #123d82,0 26px 50px rgba(0,0,0,.35)}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;border-radius:22px 22px 0 0;
        background:repeating-conic-gradient(#17325c 0 25%,#fff 0 50%) 0 0/20px 20px}
  .card h1{margin:0;font-family:"Mali","Kanit",sans-serif;font-size:clamp(40px,6vw,72px);line-height:1.15;color:#ff4f6d;
        text-shadow:0 4px 0 #ffd23f,0 8px 0 #17325c}
  .card p{font-size:clamp(17px,2vw,23px);margin:0;line-height:1.5}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-size:clamp(19px,2.2vw,26px);font-weight:800;padding:12px 30px;border:none;border-radius:999px;cursor:pointer;color:#fff;
         background:linear-gradient(180deg,#ff6b84,#e23a58);box-shadow:0 6px 0 #a3203a,0 12px 20px rgba(0,0,0,.18)}
  button:active{transform:translateY(5px);box-shadow:0 1px 0 #a3203a}
  button.blue{background:linear-gradient(180deg,#4fa8ff,#1f6fe0);box-shadow:0 6px 0 #154f9e,0 12px 20px rgba(0,0,0,.18)}
  button.tog{font-size:clamp(16px,1.7vw,21px);padding:10px 20px;color:#17325c;background:#e3eefc;box-shadow:0 5px 0 #b3c6e3}
  button.tog.on{background:linear-gradient(180deg,#ffe066,#ffc21f);box-shadow:0 5px 0 #c98f00}
  .label{font-weight:800;font-size:20px}
  .hidden{display:none!important}
  #status{font-size:16px;color:#5a7499}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>

<div id="start" class="card">
  <h1>แรงดันจอมซิ่ง!</h1>
  <p><b>แบมือ แล้วปัดไปทางขวา</b> ตรงไหนของจอก็ได้ รถจะพุ่งออกไปเลย<br>ปัดเร็ว = แรงมาก รถไปไกล · จอดให้ตรงธง อย่าให้ตกน้ำนะ!</p>
  <div class="row">
    <span class="label">เลือกรถ:</span>
    <button id="car0" class="tog" onclick="setCar(0)">🏎️ โกคาร์ท (เบา)</button>
    <button id="car1" class="tog on" onclick="setCar(1)">🚗 รถเก๋ง (กลาง)</button>
    <button id="car2" class="tog" onclick="setCar(2)">🚚 รถบรรทุก (หนัก)</button>
  </div>
  <div class="row">
    <button class="blue" onclick="startGame('solo')">เล่นคนเดียว</button>
    <button onclick="startGame('duo')">แข่ง 2 คน</button>
  </div>
  <div id="status">กำลังเปิดกล้อง...</div>
</div>

<div id="end" class="card hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <div class="row"><button class="blue" onclick="showStart()">กลับเมนู</button></div>
</div>

<script type="module">
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const video = document.getElementById('video'), statusEl = document.getElementById('status');
const THAI = 'Kanit,Tahoma,sans-serif', FUN = 'Mali,Kanit,Tahoma,sans-serif';
const P_COLORS = ['#ff5fa2', '#3fb6ff'], P_NAMES = ['ฝั่งซ้าย', 'ฝั่งขวา'];
let W, H, DPR = 1;

// ---------- ข้อมูลเกม ----------
const LEVELS = [
  {name:'ถนนชนบท', surf:'ถนน', mu:1.0, c:0.60, theme:'road', sky:['#5bb8ff','#c9ecff'],
   hint:'ถนนเรียบ แรงเสียดทานปานกลาง ลองกะแรงดูนะ!', fact:'แรงเสียดทานคือแรงที่ต้านการเคลื่อนที่ ทำให้รถค่อย ๆ ช้าลงจนหยุด'},
  {name:'ทุ่งดอกไม้', surf:'หญ้า', mu:1.4, c:0.55, theme:'grass', sky:['#7fd0ff','#f0fbff'],
   hint:'หญ้าขรุขระกว่าถนน ต้องปัดแรงขึ้นนะ!', fact:'พื้นยิ่งขรุขระ แรงเสียดทานยิ่งมาก รถเลยหยุดเร็วกว่า'},
  {name:'ชายหาดทะเล', surf:'ทราย', mu:1.9, c:0.45, theme:'sand', sky:['#ff9f5a','#ffe2a8'],
   hint:'ทรายหนืดมาก! ต้องปัดแรงสุด ๆ', fact:'ทรายมีแรงเสียดทานสูง ล้อรถจมลงไปเลยหยุดเร็ว'},
  {name:'ขั้วโลกน้ำแข็ง', surf:'น้ำแข็ง', mu:0.5, c:0.72, theme:'ice', sky:['#1b2766','#5677c4'],
   hint:'ลื่นปรี๊ด! ปัดเบา ๆ ก็พอ ระวังไถลตกน้ำ!', fact:'น้ำแข็งลื่น แรงเสียดทานน้อยมาก รถเลยไถลไปได้ไกล'},
];
const CARS = [
  {name:'โกคาร์ท', m:0.8,  size:0.85, body:'#ff8a3d', dark:'#c9561a', light:'#ffd0a8'},
  {name:'รถเก๋ง',  m:1.0,  size:1.0,  body:'#ff4f6d', dark:'#c2283f', light:'#ffd0d8'},
  {name:'รถบรรทุก', m:1.25, size:1.25, body:'#3f8fff', dark:'#1f5fc4', light:'#d6e8ff'},
];
// ฟิสิกส์ (ปรับให้ปัดมือคนจริงแล้วถึงได้ทุกคัน ทุกพื้น)
// ปัดเร็ว f (ความกว้างจอต่อวินาที) -> แรง P = f/FMAX -> v0² = P·KV/m -> ระยะ = v0²/(2·μ·G)
const G = 0.8, KV = 2.14, FMAX = 3.0, ZONES = [0.04, 0.08, 0.13], CLIFF = 0.95, SHOTS = 3, READY_LIMIT = 20;
const SAY_READY = ['ดันหนูเลย!', 'พร้อมซิ่งแล้ว!', 'ปัดแรง ๆ เลย!', 'บรื้น ๆ!'];

let mode = 'solo', carType = 1, state = 'menu', players = [], countdown = 0, lastT = 0, lastBeep = 4;
let lv = 0, shot = 0, intro = 0, particles = [], banner = null;

function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  players.forEach(layoutPlayer);
}
addEventListener('resize', resize);

// ---------- เสียง ----------
let actx = null;
function audio(){ if (!actx) try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch {} return actx; }
function tone(f, d=0.15, type='triangle', vol=0.1, delay=0, f2=null){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
function noise(d=0.4, vol=0.15, freq=900, delay=0){
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate*d, a.sampleRate), ch = buf.getChannelData(0);
  for (let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1)*(1-i/ch.length);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const sfx = {
  push:  ()=>{ noise(0.35, 0.2, 1800); tone(180,0.3,'sawtooth',0.07,0,520); },
  honk:  ()=>{ tone(440,0.12,'square',0.06); tone(350,0.16,'square',0.06,0.14); },
  star:  n => { for (let i=0;i<n;i++) tone(880+i*220,0.18,'sine',0.12,0.1+i*0.16); },
  perfect:()=> [523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,0.2,'triangle',0.12,i*0.08)),
  miss:  ()=> tone(330, 0.45, 'triangle', 0.1, 0, 160),
  fall:  ()=> tone(900, 0.7, 'sine', 0.1, 0, 120),
  splash:()=>{ noise(0.6, 0.3, 700); tone(200,0.3,'sine',0.08,0,60); },
  beep:  ()=> tone(520, 0.15, 'sine', 0.12),
  go:    ()=> tone(880, 0.35, 'triangle', 0.14),
  win:   ()=> [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.28,'triangle',0.12,i*0.12)),
};

// ---------- เมนู ----------
window.setCar = i => { carType = i; [0,1,2].forEach(k => document.getElementById('car'+k).classList.toggle('on', k===i)); };
window.showStart = ()=>{
  state = 'menu'; players = []; particles = [];
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};
window.startGame = m => {
  audio(); mode = m; lv = 0; shot = 0;
  players = mode==='solo' ? [makePlayer(0,0,1)] : [makePlayer(0,0,0.5), makePlayer(1,0.5,1)];
  players.forEach(layoutPlayer);
  particles = []; banner = null; state = 'countdown'; countdown = 3.999; lastBeep = 4;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
};
addEventListener('keydown', e=>{
  if (e.code === 'Space' && state === 'over') showStart();
  if (e.code === 'Escape') showStart();
});

// ---------- ผู้เล่น ----------
function makePlayer(idx, f0, f1){
  return {idx, f0, f1, s:0, v:0, v0:0, power:0, phase:'wait', stars:Array(LEVELS.length).fill(0), last:0, msg:null, readyT:0,
          fallY:0, fallVY:0, rot:0, splashT:-1, engT:0, squash:0, mood:'idle', bubble:null, ghost:null,
          hand:{x:-999,y:-999,seen:false,pts:null,hr:60,vx:0}, hist:[], trail:[], stroke:null};
}
function layoutPlayer(p){
  p.x0 = p.f0*W; p.x1 = p.f1*W; p.pw = p.x1 - p.x0;
  p.startX = p.x0 + p.pw*0.1; p.L = p.pw*0.72; p.groundY = H*0.74;
  p.edgeX = p.startX + CLIFF*p.L; p.waterY = H*0.93;
  p.cw = Math.min(p.pw*0.13, H*0.24, 200) * CARS[carType].size; p.ch = p.cw*0.62;
}
const carX = p => p.startX + p.s*p.L;
const say = (p, text, t=1.6) => p.bubble = {text, t};
function resetShot(p){
  Object.assign(p, {s:0, v:0, v0:0, fallY:0, fallVY:0, rot:0, splashT:-1, phase:'ready', readyT:0, msg:null, stroke:null, mood:'idle'});
  say(p, SAY_READY[Math.floor(Math.random()*SAY_READY.length)], 2);
}
function beginLevel(){ intro = 3.2; players.forEach(p => { resetShot(p); p.phase = 'wait'; p.ghost = null; p.power = 0; p.bubble = null; }); banner = null; }

// การปัด: ทั้งจอ (ฝั่งตัวเอง) ไม่ต้องโดนรถ
function updateSwipe(p, now){
  const h = p.hand;
  if (!h.seen){ if (p.stroke) endStroke(p); p.hist = []; p.trail = []; h.vx = 0; return; }
  p.hist.push({t: now, x: h.x}); while (p.hist.length > 2 && now - p.hist[0].t > 110) p.hist.shift();
  p.trail.push({x:h.x, y:h.y}); if (p.trail.length > 10) p.trail.shift();
  const a = p.hist[0], b = p.hist[p.hist.length-1], dt = (b.t - a.t)/1000;
  const vx = dt > 0.03 ? (b.x - a.x)/dt/p.pw : 0; // หน่วย: ความกว้างจอ/วินาที
  h.vx = vx;
  if (!p.stroke){ if (vx > 0.3) p.stroke = {x0: a.x, x: b.x, peak: vx, t0: a.t}; }
  else {
    p.stroke.peak = Math.max(p.stroke.peak, vx); p.stroke.x = Math.max(p.stroke.x, b.x);
    if (vx < 0.12 || now - p.stroke.t0 > 900) endStroke(p);
  }
}
function endStroke(p){
  const st = p.stroke; p.stroke = null;
  if (!st || p.phase !== 'ready' || p.readyT < 0.4) return;
  if ((st.x - st.x0)/p.pw < 0.12 || st.peak < 0.4) return; // ขยับนิดเดียว ไม่นับ
  push(p, st.peak);
}
function push(p, f){
  const car = CARS[carType];
  p.power = Math.max(0.05, Math.min(1, f/FMAX));
  p.v0 = Math.sqrt(p.power*KV/car.m); p.v = p.v0; p.phase = 'moving'; p.squash = 1; p.mood = 'go';
  sfx.push(); setTimeout(sfx.honk, 120);
  say(p, p.power > 0.75 ? 'วู้ววววว!' : p.power > 0.4 ? 'ไปแล้วว!' : 'ฟิ้ว~', 1.2);
  dust(p, carX(p) - p.cw*0.5, 16);
}
function updatePlayer(p, dt, now){
  const L = LEVELS[lv];
  updateSwipe(p, now);
  if (p.bubble){ p.bubble.t -= dt; if (p.bubble.t <= 0) p.bubble = null; }
  p.squash = Math.max(0, p.squash - dt*3);
  if (p.phase === 'ready'){
    p.readyT += dt;
    if (p.readyT > READY_LIMIT) finishShot(p, 0, 'หมดเวลา! แบมือปัดไปทางขวาแรง ๆ นะ', false);
  } else if (p.phase === 'moving'){
    p.s += p.v*dt; p.v = Math.max(0, p.v - L.mu*G*dt);
    p.mood = p.s > L.c + ZONES[2] || p.s > 0.85 ? 'scared' : 'go';
    if (p.mood === 'scared' && (!p.bubble || p.bubble.text !== 'เบรกไม่อยู่!')) say(p, 'เบรกไม่อยู่!', 1.2);
    p.engT += dt; if (p.engT > 0.08 && p.v > 0.03){ p.engT = 0; tone(55 + p.v*120, 0.07, 'sawtooth', 0.025); }
    const rate = L.theme==='sand' ? 40 : L.theme==='ice' ? 10 : 18;
    if (Math.random() < p.v*dt*rate) dust(p, carX(p) - p.cw*0.45, 2);
    if (p.s > CLIFF){ p.phase = 'falling'; p.fallVY = -H*0.15; p.mood = 'scared'; say(p, 'ว้ายยยย!', 2); sfx.fall(); }
    else if (p.v <= 0) scoreShot(p);
  } else if (p.phase === 'falling'){
    p.s = Math.min(p.s + p.v*dt*0.7, (p.x1 - p.cw*0.6 - p.startX)/p.L); p.fallVY += H*2.4*dt; p.fallY += p.fallVY*dt; p.rot += dt*3;
    if (p.splashT < 0 && p.groundY + p.fallY - p.ch*0.3 > p.waterY){ p.splashT = 0; splash(carX(p), p.waterY); sfx.splash(); }
    if (p.splashT >= 0){ p.splashT += dt; p.fallVY = Math.min(p.fallVY, H*0.25); if (p.splashT > 1.1){ p.mood = 'dizzy'; finishShot(p, 0, 'แรงเกินไป! ตกน้ำตูมเลย', false); } }
  } else if (p.phase === 'result'){
    p.resT -= dt; if (p.resT <= 0) p.phase = 'done';
  }
}
function scoreShot(p){
  const c = LEVELS[lv].c, d = Math.abs(p.s - c);
  p.ghost = p.s;
  const n = d <= ZONES[0] ? 3 : d <= ZONES[1] ? 2 : d <= ZONES[2] ? 1 : 0;
  if (n) finishShot(p, n, n === 3 ? 'PERFECT! จอดตรงธงเป๊ะ' : n === 2 ? 'เยี่ยม! เกือบตรงธงแล้ว' : 'เข้าเขตแล้ว! อีกนิดเดียว', true);
  else if (p.s < c) finishShot(p, 0, 'ยังไม่ถึง! ปัดให้เร็วขึ้นอีกหน่อย', false);
  else finishShot(p, 0, 'เลยไปนิด! ปัดเบาลงหน่อย', false);
}
function finishShot(p, n, text, ok){
  if (p.phase === 'result') return;
  p.mood = n > 0 ? 'happy' : p.splashT >= 0 ? 'dizzy' : 'sad';
  if (n > 0){ say(p, n === 3 ? 'เย้! เก่งมาก!' : 'เย้!', 2); p.squash = 1; }
  else if (p.mood !== 'dizzy') say(p, p.s < LEVELS[lv].c ? 'ไปไม่ถึงอ่ะ~' : 'เลยไปแล้ว~', 2);
  else say(p, 'บุ๋ง ๆ ๆ', 2);
  p.last = n; p.stars[lv] = Math.max(p.stars[lv], n); p.phase = 'result'; p.resT = 2.8;
  p.msg = {ok, title: text, t: 2.8, n};
  if (n === 3){ sfx.perfect(); fireworks(carX(p), p.groundY - p.ch*2.5); } else if (n > 0) sfx.star(n); else if (p.splashT < 0) sfx.miss();
}
// ---------- อนุภาค ----------
function dust(p, x, n){
  const th = LEVELS[lv].theme, col = th==='sand' ? ['#f6dc93','#e2bd6a'] : th==='ice' ? ['#ffffff','#cdf3ff'] : th==='grass' ? ['#9ee07a','#d8f5c4'] : ['#e3e3ea','#bfc0cc'];
  for (let i=0;i<n;i++) particles.push({x, y:p.groundY-6, vx:-40-Math.random()*180, vy:-40-Math.random()*140, c:col[i%2], life:0.8, g:300, r:5+Math.random()*9, puff:true});
}
function splash(x, y){
  for (let i=0;i<46;i++){ const a = -Math.PI/2 + (Math.random()-0.5)*1.6, v = 250+Math.random()*520; particles.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, c: i%3 ? '#8fd8ff' : '#ffffff', life:1.2, g:1400, r:4+Math.random()*6}); }
}
function fireworks(x, y){
  const cols = ['#ff5fa2','#3fb6ff','#ffd23f','#7be39a','#ffffff','#b48cff'];
  for (let k=0;k<3;k++){ const fx = x + (k-1)*W*0.12, fy = y - k%2*H*0.08;
    for (let i=0;i<34;i++){ const a = i/34*Math.PI*2, v = 220+Math.random()*120; particles.push({x:fx, y:fy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, c:cols[(i+k)%6], life:1.3, g:180, r:4, spark:true}); } }
}
function confetti(x0, x1){
  const cols = ['#ff5fa2','#3fb6ff','#ffd23f','#7be39a','#ffffff','#b48cff'];
  for (let i=0;i<200;i++) particles.push({x:x0+Math.random()*(x1-x0), y:-20-Math.random()*H*0.5, vx:(Math.random()-0.5)*120, vy:100+Math.random()*200, c:cols[i%6], life:3.5, slow:true, r:6, rot:Math.random()*6});
}
function advance(){
  if (state !== 'play' || !players.every(p => p.phase === 'done' || p.phase === 'wait')) return;
  const solo3 = mode === 'solo' && players[0].stars[lv] === 3;
  if (shot + 1 < SHOTS && !solo3){ shot++; players.forEach(resetShot); return; }
  shot = 0;
  if (lv + 1 >= LEVELS.length){ players.forEach(p => p.phase = 'end'); endGame(); return; }
  lv++;
  beginLevel();
}

// ---------- จบเกม ----------
function endGame(){
  state = 'over'; sfx.win();
  const total = p => p.stars.reduce((a,b)=>a+b,0), max = LEVELS.length*3;
  const facts = '<br><span style="font-size:.85em;color:#5a7499">จำไว้นะ: ยิ่งออกแรงมาก ของยิ่งเคลื่อนที่ไกล · พื้นยิ่งขรุขระ แรงเสียดทานยิ่งมาก · ของยิ่งหนัก ยิ่งต้องใช้แรงมาก</span>';
  const row = p => LEVELS.map((L,i)=>`${L.surf} <span style="color:#f5a300">${'★'.repeat(p.stars[i])}</span>${'☆'.repeat(3-p.stars[i])}`).join(' · ');
  const T = document.getElementById('endTitle');
  if (mode === 'solo'){
    const p = players[0], t = total(p); confetti(0, W);
    const title = t >= 11 ? 'นักซิ่งระดับตำนาน!' : t >= 8 ? 'นักซิ่งมือโปร!' : t >= 4 ? 'นักซิ่งฝีมือดี!' : 'นักซิ่งฝึกหัด!';
    setTimeout(()=>{
      T.textContent = title; T.style.color = '#ff4f6d';

      document.getElementById('end').classList.remove('hidden');
    }, 1400);
    return;
  }
  const [a, b] = players, ta = total(a), tb = total(b);
  const w = ta > tb ? a : tb > ta ? b : null;
  if (w){ confetti(w.x0, w.x1); banner = {p: w}; } else confetti(0, W);
  setTimeout(()=>{
    T.textContent = w ? `${P_NAMES[w.idx]}ชนะ!` : 'เสมอกัน! เก่งทั้งคู่'; T.style.color = w ? P_COLORS[w.idx] : '#ff4f6d';
    const line = p => `<b style="color:${P_COLORS[p.idx]}">${P_NAMES[p.idx]}</b> ${total(p)} ดาว<br><span style="font-size:.8em">${row(p)}</span>`;
    document.getElementById('endText').innerHTML = `${line(a)}<br>${line(b)}${facts}`;
    document.getElementById('end').classList.remove('hidden');

}

// ---------- จับมือ ----------
let handOK = false, landmarker = null, lastVideoTime = -1;
addEventListener('mousemove', e=>{
  if (handOK || !players.length) return;
  const p = players.find(p => e.clientX >= p.x0 && e.clientX < p.x1) || players[0];
  players.forEach(q => { if (q !== p) q.hand.seen = false; });
  p.hand.x = e.clientX; p.hand.y = e.clientY; p.hand.seen = true; p.hand.hr = Math.min(W,H)*0.031;
});
async function initHands(){
  try{
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    await video.play();
    statusEl.textContent = 'เปิดกล้องแล้ว กำลังโหลดตัวจับมือ...';
    const {FilesetResolver, HandLandmarker} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d}, runningMode:'VIDEO', numHands:2});
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    handOK = true;
    statusEl.textContent = 'พร้อมเล่น! ยืนห่างกล้องประมาณ 1–1.5 เมตร แล้วยกมือขึ้น';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'เปิดกล้องหรือตัวจับมือไม่ได้ ตอนนี้เล่นด้วยเมาส์ได้ (ลากเมาส์ไปทางขวาเร็ว ๆ) · ตรวจว่าอนุญาตกล้องและต่ออินเทอร์เน็ต';
  }
}
const mapPt = p => ({x:(1-(0.5+(p.x-0.5)*1.4))*W, y:(0.5+(p.y-0.5)*1.4)*H});
function trackHands(){
  if (!handOK || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const r = landmarker.detectForVideo(video, performance.now());
  const found = (r.landmarks || []).map(L => {
    const pts = L.map(mapPt), c = [0,5,9,13,17].reduce((a,i)=>({x:a.x+pts[i].x/5, y:a.y+pts[i].y/5}), {x:0,y:0});
    return {pts, c, palm: Math.hypot(pts[0].x-pts[9].x, pts[0].y-pts[9].y)};
  });
  const assigned = players.map(()=>null);
  if (mode === 'solo'){ if (found[0]) assigned[0] = found[0]; }
  else for (const f of found){ const side = f.c.x < W/2 ? 0 : 1; if (!assigned[side]) assigned[side] = f; }
  players.forEach((p,i)=>{
    const f = assigned[i], h = p.hand;
    if (!f){ h.seen = false; h.pts = null; return; }
    h.pts = f.pts;
    h.x = h.seen ? h.x + (f.c.x-h.x)*0.75 : f.c.x;
    h.y = h.seen ? h.y + (f.c.y-h.y)*0.75 : f.c.y;
    h.hr = Math.max(Math.min(W,H)*0.031, f.palm*0.38);
    h.seen = true;
  });
}

// ---------- ตัวช่วยวาด ----------
function rr(x, y, w, h, r){ r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function label(t, x, y, size, fill='#fff', font=FUN, stroke='#17325c'){

  ctx.lineWidth = Math.max(5, size*0.2); ctx.strokeStyle = stroke; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function starPath(x, y, r){
  ctx.beginPath();
  for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr2 = i%2 ? r*0.45 : r; ctx.lineTo(x+Math.cos(a)*rr2, y+Math.sin(a)*rr2); }
  ctx.closePath();
}
function star(x, y, r, on){
  starPath(x, y, r); ctx.fillStyle = on ? '#ffd23f' : 'rgba(255,255,255,.35)'; ctx.fill();
  ctx.lineWidth = Math.max(2, r*0.16); ctx.lineJoin = 'round'; ctx.strokeStyle = on ? '#c98f00' : 'rgba(23,50,92,.5)'; ctx.stroke();
}
function cloud(x, y, s, a=0.95){
  ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath();
  ctx.arc(x, y, s*0.5, 0, Math.PI*2); ctx.arc(x+s*0.45, y-s*0.2, s*0.45, 0, Math.PI*2); ctx.arc(x+s*0.9, y, s*0.4, 0, Math.PI*2); ctx.arc(x+s*0.45, y+s*0.1, s*0.45, 0, Math.PI*2); ctx.fill();
}
function hills(y0, amp, freq, phase, col){
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x=0; x<=W+20; x+=20) ctx.lineTo(x, y0 - amp*(0.5+0.5*Math.sin(x*freq/W*Math.PI*2 + phase)));

}
const hillY = (x, y0, amp, freq, phase) => y0 - amp*(0.5+0.5*Math.sin(x*freq/W*Math.PI*2 + phase));

// ---------- ฉาก ----------
function drawSky(t){

  const [c1, c2] = playing ? L.sky : ['#5bb8ff','#c9ecff'];
  if (handOK && video.videoWidth){
    const vw=video.videoWidth, vh=video.videoHeight, s=Math.max(W/vw,H/vh);
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
    ctx.drawImage(video,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s); ctx.restore();
    const g = ctx.createLinearGradient(0,0,0,H*0.62); g.addColorStop(0, c1+'99'); g.addColorStop(1, c2+'33');

const SURF = {

function drawTrack(p, t){

  ctx.font = `700 ${f*0.8}px ${THAI}`; ctx.textAlign = 'right'; ctx.lineWidth = 5; ctx.strokeStyle = '#17325c'; ctx.fillStyle = '#fff';
  ctx.strokeText('แรง', bx - 10, by + bh/2); ctx.fillText('แรง', bx - 10, by + bh/2);
  ctx.fillStyle = 'rgba(23,50,92,.75)'; rr(bx-3, by-3, bw+6, bh+6, (bh+6)/2); ctx.fill();
  if (live > 0){ const g = ctx.createLinearGradient(bx, 0, bx+bw, 0); g.addColorStop(0,'#7be39a'); g.addColorStop(0.55,'#ffd23f'); g.addColorStop(1,'#ff5a6e');
    ctx.save(); rr(bx, by, bw, bh, bh/2); ctx.clip(); ctx.fillStyle = g; ctx.fillRect(bx, by, bw*live, bh); ctx.restore(); }
}
function drawDuoMiddle(){
  ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.setLineDash([14,12]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  label('VS', W/2, H*0.36, Math.min(W,H)*0.07, '#ffd23f');
}
function drawMsg(p, dt){
  const m = p.msg; if (!m) return;
  m.t -= dt; if (m.t <= 0){ p.msg = null; return; }
  const pw = p.pw, f = Math.max(18, Math.min(pw, H*1.6)*(mode==='solo'?0.03:0.036));
  const w = Math.min(pw*0.85, 820), h = f*3.8, x = p.x0 + (pw-w)/2, y = H*0.2;
  ctx.globalAlpha = Math.min(1, m.t*2);
  ctx.fillStyle = 'rgba(255,255,255,.95)'; rr(x, y, w, h, f); ctx.fill();
  ctx.strokeStyle = m.ok ? '#3fbf6a' : '#ff5a6e'; ctx.lineWidth = 5; ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`700 ${f}px ${FUN}`; ctx.fillStyle = m.ok ? '#1f8f4a' : '#d6334b';
  ctx.fillText(m.title, x+w/2, y+f*1.15, w-24);
  const sr = f*0.6; for (let k=0;k<3;k++) star(x+w/2 + (k-1)*sr*2.6, y+f*2.65, sr, m.n > k);
  ctx.globalAlpha = 1;
}
function drawIntro(dt){
  intro -= dt;
  const L = LEVELS[lv], u = Math.min(W,H), f = u*0.04, w = Math.min(W*0.82, 880), h = f*6, x = (W-w)/2, y = H*0.17;
  const pop = Math.min(1, (3.2 - intro)*4), a = Math.min(1, intro*3);
  ctx.globalAlpha = a; ctx.save(); ctx.translate(W/2, y + h/2); ctx.scale(0.8 + 0.2*pop, 0.8 + 0.2*pop); ctx.translate(-W/2, -(y + h/2));
  ctx.fillStyle = 'rgba(255,255,255,.96)'; rr(x, y, w, h, f); ctx.fill(); ctx.strokeStyle = '#1f5fc4'; ctx.lineWidth = 6; ctx.stroke();
  label(`ด่าน ${lv+1}: ${L.name}`, W/2, y+f*1.4, f*1.5, '#ff4f6d');
  ctx.font = `600 ${f*0.85}px ${THAI}`; ctx.fillStyle='#17325c'; ctx.textAlign='center'; ctx.textBaseline = 'middle';
  ctx.fillText(`พื้น${L.surf}: ${L.hint}`, W/2, y+f*3.2, w-30);
  ctx.font = `400 ${f*0.72}px ${THAI}`; ctx.fillStyle='#5a7499'; ctx.fillText(L.fact, W/2, y+f*4.6, w-30);
  ctx.restore(); ctx.globalAlpha = 1;
  if (intro <= 0) players.forEach(resetShot);
}
function drawParticles(dt){
  for (const p of particles){
    if (p.slow){ p.vx += (Math.random()-0.5)*40*dt; p.vy = Math.min(p.vy + 40*dt, 260); p.rot += dt*4; } else p.vy += (p.g ?? 900)*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*(p.slow?0.6:1.3);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    if (p.slow){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r*0.5, p.r*2, p.r); ctx.restore(); }
    else { const r = p.puff ? p.r*(1.6 - p.life*0.6) : p.r; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill(); }
  }
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0 && p.y < H+40);
}
function drawCountdown(dt){
  countdown -= dt;
  const n = Math.ceil(countdown);
  if (n !== lastBeep && n >= 1){ sfx.beep(); lastBeep = n; }
  if (countdown <= 0){ sfx.go(); state = 'play'; beginLevel(); return; }
  const frac = countdown - Math.floor(countdown);
  label(String(n), W/2, H*0.34, Math.min(W,H)*(0.2 + 0.07*frac), '#ffd23f');
  label(mode==='duo' ? 'ยืนคนละฝั่ง แล้วยกมือขึ้น!' : 'สตาร์ทเครื่อง! ยกมือขึ้นเลย', W/2, H*0.52, Math.min(W,H)*0.05);
}
function drawWinner(){
  if (!banner || !banner.p) return;
  const p = banner.p, s = 1 + Math.sin(performance.now()/180)*0.06;
  label('ชนะ!', (p.x0+p.x1)/2, H*0.34, Math.min(W,H)*0.16*s, P_COLORS[p.idx]);
}

function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  trackHands(); drawSky(t);
  if (state !== 'menu' && players.length){
    if (state === 'play' && intro <= 0){ players.forEach(p => updatePlayer(p, dt, t)); advance(); }
    else players.forEach(p => updateSwipe(p, t));
    drawScenery(t);
    players.forEach(p => drawTrack(p, t));
    players.forEach(p => drawCar(p, t));
    drawParticles(dt);
    if (mode === 'duo') drawDuoMiddle();
    players.forEach(p => drawSwipeGuide(p, t));
    players.forEach(drawBubble);
    players.forEach(drawHUD);
    players.forEach(p => drawMsg(p, dt));
    if (state === 'countdown') drawCountdown(dt);
    if (state === 'play' && intro > 0) drawIntro(dt);
    drawWinner();
  } else drawParticles(dt);
  players.forEach(drawHand);
  requestAnimationFrame(loop);
}
window.__p = () => ({players, lv, shot, intro, state, push});
resize(); initHands(); requestAnimationFrame(loop);
</script>
